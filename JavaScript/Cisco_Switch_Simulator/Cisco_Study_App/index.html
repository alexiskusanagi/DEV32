<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Cisco Study Simulator
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =====================================================
         ÁREA DE TOPOLOGIA
         ===================================================== -->

    <section
        id="topology-container"
        aria-label="Topologia do laboratório"
    >

        <!-- Renderizado dinamicamente pelo ui.js -->

    </section>



    <!-- =====================================================
         PAINEL ESQUERDO
         ===================================================== -->

    <aside class="panel left-panel">

        <h3>
            Help - Comandos
        </h3>

        <div
            id="help-list"
            class="scrollable-list"
        >

            <!-- Gerado pelo ui.js -->

        </div>

    </aside>



    <!-- =====================================================
         ÁREA CENTRAL
         ===================================================== -->

    <main class="main-content">


        <!-- =================================================
             SELETOR DE DISPOSITIVO
             ================================================= -->

        <div class="device-selector">

            <div class="device-selector-buttons">

                <button
                    id="btn-switch"
                    class="device-selector-button active"
                    type="button"
                    data-device="switch"
                >

                    🔀 Switch

                </button>


                <button
                    id="btn-router"
                    class="device-selector-button"
                    type="button"
                    data-device="router"
                >

                    🌐 Router

                </button>

            </div>

        </div>



        <!-- =================================================
             MISSÕES
             ================================================= -->

        <div class="mission-bar">

            <label for="mission-selector">

                🎯 Objetivo de Estudo:

            </label>


            <select
                id="mission-selector"
            >

                <option value="welcome">

                    -- Selecione um objetivo --

                </option>

            </select>

        </div>

        <!-- ================================================= 
         CONTEÚDO DA MISSÃO 
         ================================================= --> 
         <section 
            id="mission-content" 
            class="mission-content" 
            aria-label="Conteúdo do objetivo de estudo" >

         </section>
        <!-- Renderizado dinamicamente pelo ui.js -->



        <!-- =================================================
             TERMINAL CLI
             ================================================= -->

        <section class="cli-container">


            <div
                id="cli-screen"
            >

                <!-- Conteúdo gerado pelo cli.js -->

            </div>


            <div class="cli-input-area">

                <span
                    id="cli-prompt"
                >

                    Device&gt;

                </span>


                <input
                    id="cli-input"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Entrada de comando CLI"
                >

            </div>


        </section>



        <!-- =================================================
             BOTÕES
             ================================================= -->

        <div class="button-area">


            <button
                id="btn-command-tree"
                class="btn"
                type="button"
            >

                🌲 Command Tree

            </button>


            <button
                id="btn-reset"
                class="btn danger"
                type="button"
            >

                🟥 Reset Device

            </button>


        </div>


    </main>



    <!-- =====================================================
         PAINEL DIREITO
         ===================================================== -->

    <aside class="panel right-panel">


        <!-- =================================================
             HISTÓRICO
             ================================================= -->

        <section class="status-box">

            <h3>
                Histórico
            </h3>


            <div
                id="history-list"
                class="scrollable-list"
            >

                <!-- Gerado pelo ui.js -->

            </div>

        </section>



        <!-- =================================================
             CONFIGURAÇÃO E STATUS
             ================================================= -->

        <section class="status-box">

            <h3>
                Configuração e Status
            </h3>


            <div
                id="status-display"
                class="scrollable-list"
            >

                <!-- Gerado pelo ui.js -->

            </div>

        </section>


    </aside>



    <!-- =====================================================
         MODAL COMMAND TREE
         ===================================================== -->

    <div
        id="tree-modal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="command-tree-title"
    >


        <button
            id="btn-close-tree"
            class="btn danger"
            type="button"
        >

            ❌ Fechar

        </button>


        <h2 id="command-tree-title">

            🛡️ Command Tree

        </h2>


        <div
            id="command-tree-content"
        >

            <!-- Gerado dinamicamente pelo ui.js -->

        </div>


    </div>



    <!-- =====================================================
         APLICAÇÃO
         ===================================================== -->

    <script
        type="module"
        src="js/core/app.js"
    ></script>


</body>

</html>
